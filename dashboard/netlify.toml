# Netlify: the ESTARA dashboard for the free public demo (docs/deploy-free.md).
# Netlify site settings: Base directory = dashboard. Environment variable BACKEND_URL = the
# backend's address, e.g. https://estara-demo-api.onrender.com (the /api proxy uses it).
[build]
  command = "npm run build"
  publish = ".next"
  # Build only when the dashboard itself changed: each production deploy uses Free-plan credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
